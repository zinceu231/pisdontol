<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pisdontol</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-modal-pop {
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* CSS untuk Spotlight Glow Card */
        .spotlight-card {
            position: relative;
            overflow: hidden;
        }
        .spotlight-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(99, 102, 241, 0.15), transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 3;
        }
        .spotlight-card:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-[#0c0c0e] text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- Header -->
    <header class="max-w-6xl w-full mx-auto px-6 pt-14 pb-4 text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-3 border border-indigo-500/20 shadow-xl backdrop-blur-md">
            <i class="fa-solid fa-compass text-2xl"></i>
        </div>
        <h1 class="text-3xl font-semibold tracking-tight text-slate-100 mb-2">
            Web Launcher Hub
        </h1>
        <p class="text-slate-400 text-xs mb-6 max-w-sm mx-auto">Arahkan kursor ke kartu untuk melihat efek Spotlight Glow interaktif.</p>
        
        <!-- Search Input -->
        <div class="relative max-w-md mx-auto">
            <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="text" id="searchInput" oninput="filterShortcuts()" placeholder="Cari shortcut web..." 
                   class="w-full bg-[#121215] text-slate-200 placeholder-slate-500 pl-11 pr-4 py-3 rounded-2xl border border-slate-800 text-xs focus:outline-none focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/10 transition-all shadow-inner">
        </div>
    </header>

    <!-- Main Section: Carousel Container -->
    <main class="max-w-7xl w-full mx-auto px-4 flex-grow flex flex-col justify-center my-auto pb-12">
        
        <!-- Header & Action Button -->
        <div class="flex justify-between items-center mb-4 px-6">
            <span class="text-xs font-medium text-slate-400 uppercase tracking-widest flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span> Koleksi Utama
            </span>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs font-medium transition-all duration-300 flex items-center gap-1.5 shadow-lg shadow-indigo-600/20 active:scale-95">
                <i class="fa-solid fa-plus text-[10px]"></i> Tambah Web
            </button>
        </div>

        <!-- Carousel Wrapper -->
        <div class="relative px-4" id="carouselWrapper">
            <!-- Track / List Kartu Horizontal -->
            <div id="carouselTrack" class="flex gap-6 overflow-x-auto no-scrollbar py-6 px-2">
                <!-- Card item akan di-render otomatis lewat JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-600 text-xs border-t border-slate-900/60">
        Spotlight Glow & Velocity 15 Architecture
    </footer>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-all">
        <div class="bg-[#121215] rounded-3xl p-8 w-full max-w-lg border border-slate-800 shadow-2xl relative animate-modal-pop">
            <h3 id="modalTitle" class="text-xl font-semibold text-slate-100 mb-6">Tambah Web Baru</h3>
            
            <form id="shortcutForm" onsubmit="saveShortcut(event)" class="space-y-5">
                <input type="hidden" id="shortcutId">
                
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-2">Nama Web</label>
                    <input type="text" id="titleInput" required placeholder="Contoh: GitHub" 
                           class="w-full bg-[#0c0c0e] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-2">URL / Link Web</label>
                    <input type="url" id="urlInput" required placeholder="https://github.com" 
                           class="w-full bg-[#0c0c0e] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-2">URL Gambar Preview (Opsional)</label>
                    <input type="url" id="imageInput" placeholder="https://images.unsplash.com/..." 
                           class="w-full bg-[#0c0c0e] border border-slate-800 rounded-xl px-4 py-3.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all">
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-5 py-3.5 bg-slate-800/50 hover:bg-slate-800 rounded-xl text-xs font-medium text-slate-300 transition-colors">
                        Batal
                    </button>
                    <button type="submit" class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium shadow-lg shadow-indigo-600/20 transition-all">
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const defaultShortcuts = [
            { id: 1, title: 'Google Antigravity', url: 'https://mrdoob.com/projects/chromeexperiments/google-space/', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop' },
            { id: 2, title: 'Kimi Code', url: 'https://kimi.moonshot.cn', image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=600&auto=format&fit=crop' },
            { id: 3, title: 'Claude Code', url: 'https://claude.ai', image: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=600&auto=format&fit=crop' },
            { id: 4, title: 'OpenAI Codex', url: 'https://openai.com', image: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?q=80&w=600&auto=format&fit=crop' },
            { id: 5, title: 'GitHub', url: 'https://github.com', image: 'https://images.unsplash.com/photo-1556075798-4825dfaaf498?q=80&w=600&auto=format&fit=crop' }
        ];

        let shortcuts = JSON.parse(localStorage.getItem('threads_spotlight_v1')) || defaultShortcuts;

        document.addEventListener('DOMContentLoaded', () => {
            renderShortcuts(shortcuts);
            initSpeed15HoverScroll();
            initSpotlightGlow();
        });

        function renderShortcuts(items) {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = '';

            if (items.length === 0) {
                track.innerHTML = `<p class="w-full text-center text-slate-500 py-8 text-xs">Tidak ada web ditemukan.</p>`;
                return;
            }

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = "spotlight-card min-w-[360px] max-w-[360px] bg-[#121215] border border-slate-800/80 rounded-3xl overflow-hidden flex flex-col relative group shrink-0 transition-all duration-300 hover:border-indigo-500/60 hover:shadow-2xl hover:shadow-indigo-500/10 hover:scale-[1.02]";
                
                const imgUrl = item.image || `https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=600&auto=format&fit=crop`;

                card.innerHTML = `
                    <!-- Action Buttons -->
                    <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-all duration-300 flex gap-1 z-10 bg-black/70 rounded-xl p-1.5 backdrop-blur-md border border-white/10 shadow-lg">
                        <button onclick="editShortcut(${item.id})" class="text-slate-300 hover:text-indigo-400 p-1.5 text-xs transition-colors">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteShortcut(${item.id})" class="text-slate-300 hover:text-red-400 p-1.5 text-xs transition-colors">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>

                    <!-- Link Card -->
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="flex flex-col h-full pointer-events-auto relative z-20">
                        <!-- Preview Image Container -->
                        <div class="w-full h-56 bg-[#0c0c0e] overflow-hidden relative">
                            <img src="${imgUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#121215] via-transparent to-transparent opacity-50"></div>
                        </div>
                        
                        <!-- Card Footer / Title -->
                        <div class="p-5 bg-[#121215] flex items-center justify-between">
                            <span class="font-medium text-slate-200 text-sm truncate pr-2">${item.title}</span>
                            <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-indigo-600/20 group-hover:text-indigo-400 transition-all">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400 group-hover:text-indigo-400"></i>
                            </div>
                        </div>
                    </a>
                `;
                track.appendChild(card);
            });
            // Re-init spotlight listener setelah render ulang
            initSpotlightGlow();
        }

        // Efek Cahaya Mengikuti Kursor (Spotlight Glow)
        function initSpotlightGlow() {
            const cards = document.querySelectorAll('.spotlight-card');
            cards.forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
            });
        }

        // Kecepatan Geser Carousel (Velocity 15)
        function initSpeed15HoverScroll() {
            const wrapper = document.getElementById('carouselWrapper');
            const track = document.getElementById('carouselTrack');
            
            let scrollDirection = 0;
            let animationFrameId;

            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const width = rect.width;
                const edgeZone = width * 0.35;

                if (mouseX < edgeZone) {
                    scrollDirection = -15;
                } else if (mouseX > width - edgeZone) {
                    scrollDirection = 15;
                } else {
                    scrollDirection = 0;
                }
            });

            wrapper.addEventListener('mouseleave', () => {
                scrollDirection = 0;
            });

            function step() {
                if (scrollDirection !== 0) {
                    track.scrollLeft += scrollDirection;
                }
                animationFrameId = requestAnimationFrame(step);
            }
            animationFrameId = requestAnimationFrame(step);
        }

        function filterShortcuts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = shortcuts.filter(s => s.title.toLowerCase().includes(query));
            renderShortcuts(filtered);
        }

        function saveShortcut(e) {
            e.preventDefault();
            const id = document.getElementById('shortcutId').value;
            const title = document.getElementById('titleInput').value.trim();
            let url = document.getElementById('urlInput').value.trim();
            const image = document.getElementById('imageInput').value.trim();

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            if (id) {
                shortcuts = shortcuts.map(s => s.id == id ? { id: Number(id), title, url, image } : s);
            } else {
                shortcuts.push({ id: Date.now(), title, url, image });
            }

            localStorage.setItem('threads_spotlight_v1', JSON.stringify(shortcuts));
            renderShortcuts(shortcuts);
            closeModal();
        }

        function deleteShortcut(id) {
            if (confirm('Hapus shortcut ini?')) {
                shortcuts = shortcuts.filter(s => s.id !== id);
                localStorage.setItem('threads_spotlight_v1', JSON.stringify(shortcuts));
                renderShortcuts(shortcuts);
            }
        }

        function editShortcut(id) {
            const item = shortcuts.find(s => s.id === id);
            if (!item) return;

            document.getElementById('shortcutId').value = item.id;
            document.getElementById('titleInput').value = item.title;
            document.getElementById('urlInput').value = item.url;
            document.getElementById('imageInput').value = item.image || '';
            document.getElementById('modalTitle').innerText = 'Edit Web';

            openModal(true);
        }

        function openModal(isEdit = false) {
            if (!isEdit) {
                document.getElementById('shortcutForm').reset();
                document.getElementById('shortcutId').value = '';
                document.getElementById('modalTitle').innerText = 'Tambah Web Baru';
            }
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
    </script>
</body>
</html>
